<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .weather-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .city-name {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .date {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .weather-icon { font-size: 80px; margin-bottom: 20px; }
        .temperature {
            font-size: 72px;
            font-weight: 300;
            color: #333;
            margin-bottom: 10px;
        }
        .weather-desc {
            font-size: 20px;
            color: #666;
            margin-bottom: 30px;
            text-transform: capitalize;
        }
        .weather-details {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin-bottom: 30px;
        }
        .detail-item { flex: 1; }
        .detail-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .detail-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .search-box input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .search-box input:focus { border-color: #667eea; }
        .search-box button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .search-box button:hover { transform: scale(1.05); }
        .error {
            color: #e74c3c;
            margin-top: 10px;
            display: none;
        }
        .loading {
            display: none;
            font-size: 18px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="weather-container">
        <div class="city-name" id="cityName">Muscat, Oman</div>
        <div class="date" id="date"></div>
        <div class="weather-icon" id="weatherIcon">☀️</div>
        <div class="temperature" id="temperature">--°C</div>
        <div class="weather-desc" id="weatherDesc">Loading...</div>
        
        <div class="weather-details">
            <div class="detail-item">
                <div class="detail-label">Wind Speed</div>
                <div class="detail-value" id="windSpeed">-- km/h</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Wind Direction</div>
                <div class="detail-value" id="windDir">--°</div>
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name">
            <button onclick="searchWeather()">Search</button>
        </div>
        <div class="error" id="error"></div>
        <div class="loading" id="loading">Loading...</div>
    </div>

    <script>
        const weatherCodes = {
            0: { icon: '☀️', desc: 'Clear sky' },
            1: { icon: '🌤️', desc: 'Mainly clear' },
            2: { icon: '⛅', desc: 'Partly cloudy' },
            3: { icon: '☁️', desc: 'Overcast' },
            45: { icon: '🌫️', desc: 'Foggy' },
            48: { icon: '🌫️', desc: 'Depositing rime fog' },
            51: { icon: '🌧️', desc: 'Light drizzle' },
            53: { icon: '🌧️', desc: 'Moderate drizzle' },
            55: { icon: '🌧️', desc: 'Dense drizzle' },
            61: { icon: '🌧️', desc: 'Slight rain' },
            63: { icon: '🌧️', desc: 'Moderate rain' },
            65: { icon: '🌧️', desc: 'Heavy rain' },
            71: { icon: '❄️', desc: 'Slight snow' },
            73: { icon: '❄️', desc: 'Moderate snow' },
            75: { icon: '❄️', desc: 'Heavy snow' },
            80: { icon: '🌦️', desc: 'Slight rain showers' },
            81: { icon: '🌦️', desc: 'Moderate rain showers' },
            82: { icon: '🌦️', desc: 'Violent rain showers' },
            95: { icon: '⛈️', desc: 'Thunderstorm' },
            96: { icon: '⛈️', desc: 'Thunderstorm with hail' },
            99: { icon: '⛈️', desc: 'Thunderstorm with heavy hail' }
        };

        function getWeatherInfo(code) {
            return weatherCodes[code] || { icon: '🌤️', desc: 'Unknown' };
        }

        function updateDate() {
            const now = new Date();
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }

        function getWindDirection(degrees) {
            const directions = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
            return directions[Math.round(degrees / 22.5) % 16];
        }

        async function fetchWeather(city) {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            loading.style.display = 'block';
            error.style.display = 'none';

            try {
                const response = await fetch(`http://localhost:8080/api/weather?city=${encodeURIComponent(city)}`);
                const data = await response.json();
                
                if (data.error) throw new Error(data.error);
                
                document.getElementById('cityName').textContent = data.cityName;
                document.getElementById('temperature').textContent = `${data.current_weather.temperature}°C`;
                const weatherInfo = getWeatherInfo(data.current_weather.weathercode);
                document.getElementById('weatherIcon').textContent = weatherInfo.icon;
                document.getElementById('weatherDesc').textContent = weatherInfo.desc;
                document.getElementById('windSpeed').textContent = `${data.current_weather.windspeed} km/h`;
                document.getElementById('windDir').textContent = `${getWindDirection(data.current_weather.winddirection)} (${data.current_weather.winddirection}°)`;
            } catch (err) {
                error.textContent = 'Error: ' + err.message;
                error.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        }

        function searchWeather() {
            const city = document.getElementById('cityInput').value.trim();
            if (city) fetchWeather(city);
        }

        document.getElementById('cityInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchWeather();
        });

        document.addEventListener('DOMContentLoaded', () => {
            updateDate();
            fetchWeather('Muscat');
        });
    </script>
</body>
</html>
